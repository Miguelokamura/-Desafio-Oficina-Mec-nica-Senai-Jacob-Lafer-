<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Agendamentos</title></head><body><header id="topo"></header><main><div id="msg" class="msg"></div>
<div class="card"><h3>Novo agendamento</h3><form id="f" class="grid">
<label>Veículo<select id="veiculo_id" required></select></label><label>Serviço<select id="servico_id" required></select></label>
<label>Data e hora<input id="data" type="datetime-local" required></label><label>Observação<input id="obs"></label><button>Agendar</button></form></div>
<div class="card" id="reag" style="display:none"><h3 id="rt"></h3><form id="fr" class="grid"><input type="hidden" id="rid">
<label>Nova data e hora<input id="rdata" type="datetime-local" required></label><div><button>Salvar nova data</button> <button type="button" class="sec" id="rc">Cancelar</button></div></form></div>
<div class="card"><table><thead><tr><th>Data</th><th>Cliente</th><th>Veículo</th><th>Serviço</th><th>Status</th><th></th></tr></thead><tbody id="lista"></tbody></table></div></main>
<script src="/static/app.js"></script><script>
async function carregar(){ const dados=await api("/api/agendamentos"); lista.replaceChildren();
  dados.forEach(a=>{ const tr=el("tr"); tr.append(el("td",fmtData(a.data_agendamento)));
    const c=el("td"); c.append(el("strong",a.cliente_nome),el("br"),document.createTextNode([a.telefone,a.email,a.endereco].filter(Boolean).join(" | "))); tr.append(c);
    tr.append(el("td",a.placa+" - "+a.marca+" "+a.modelo+" "+a.ano+(a.cor?" ("+a.cor+")":"")), el("td",a.servico), el("td",a.status));
    const td=el("td"); const e=el("button","Reagendar"); e.onclick=()=>{ rid.value=a.id; rdata.value=a.data_agendamento.slice(0,16); rt.textContent="Reagendar #"+a.id+" - "+a.cliente_nome; reag.style.display="block"; scrollTo(0,0); };
    const x=el("button","Excluir",{className:"perigo"}); x.onclick=async()=>{ if(!confirm("Excluir agendamento?"))return; try{ await api("/api/agendamentos/"+a.id,"DELETE"); mensagem("ok","Agendamento excluído."); carregar(); }catch(er){ mensagem("erro",er.message);} };
    td.append(e," ",x); tr.append(td); lista.append(tr); }); }
async function selects(){ const [vs,ss]=await Promise.all([api("/api/veiculos"),api("/api/servicos")]);
  veiculo_id.replaceChildren(el("option","Selecione...",{value:""})); vs.forEach(v=>veiculo_id.append(el("option",v.placa+" - "+v.modelo+" ("+v.cliente_nome+")",{value:v.id})));
  servico_id.replaceChildren(el("option","Selecione...",{value:""})); ss.forEach(s=>servico_id.append(el("option",s.descricao,{value:s.id}))); }
rc.onclick=()=>reag.style.display="none";
f.onsubmit=async e=>{ e.preventDefault(); try{ await api("/api/agendamentos","POST",{veiculo_id:veiculo_id.value,servico_id:servico_id.value,data_agendamento:data.value,observacao:obs.value});
  mensagem("ok","Agendamento criado."); f.reset(); carregar(); }catch(er){ mensagem("erro",er.message);} };
fr.onsubmit=async e=>{ e.preventDefault(); try{ await api("/api/agendamentos/"+rid.value,"PUT",{data_agendamento:rdata.value});
  mensagem("ok","Data atualizada."); reag.style.display="none"; carregar(); }catch(er){ mensagem("erro",er.message);} };
montarMenu().then(selects).then(carregar);
</script></body></html>
